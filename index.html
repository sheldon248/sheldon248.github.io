---
layout: default
title: 博客首页
---
<ul class="post-list">
  {% for post in site.posts limit:5 %}
    <li class="post-item">
      <a class='link' href="{{ post.url }}">{{ post.title }}</a>
      <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
    </li>
  {% endfor %}
</ul>
